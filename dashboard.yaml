# Tab5 grow dashboard for the M5Stack Tab5 (ST7121/ST7123 panel): single-probe layout
#
# Two swipeable screens of Home Assistant data, each tile showing the live value and a
# 6-hour chart:
#   Climate:   VPD, CO2, temperature, humidity
#   Substrate: temperature, VWC, bulk EC from one probe
# For several zones with two probes each, use dashboard-zones.yaml instead.
#
# Don't edit this file: include it from your device YAML (see example.yaml) and override
# the substitutions there. The defaults are here and in parts/base.yaml. Your device YAML
# also holds wifi/api/ota, since remote packages can't use secrets.
#
# Needs ESPHome 2026.8 or newer. In Home Assistant, turn on "Allow the device to perform
# Home Assistant actions" for the device, so it can fetch the last 6 hours from HA's
# statistics at boot.

substitutions:
  substrate_temp_entity: sensor.substrate_temperature
  vwc_entity: sensor.substrate_vwc
  bulk_ec_entity: sensor.substrate_bulk_ec

packages:
  base: !include parts/base.yaml

esphome:
  on_boot:
    - priority: -50
      then:
        - lambda: |-
            using namespace grow_dashboard;
            track(id(substrate_temp), "${substrate_temp_entity}");
            track(id(vwc), "${vwc_entity}");
            track(id(bulk_ec), "${bulk_ec_entity}");
            const char *range = "6 h  %s – %s";
            // canvas, range label and text, entity, colour, target low/high, smallest y span, decimals
            add_chart(id(substrate_temp_chart), id(substrate_temp_range), range, "${substrate_temp_entity}", id(accent), ${substrate_temp_low}, ${substrate_temp_high}, 3, ${substrate_temp_decimals});
            add_chart(id(vwc_chart), id(vwc_range), range, "${vwc_entity}", id(accent), ${vwc_low}, ${vwc_high}, 10, ${vwc_decimals});
            add_chart(id(bulk_ec_chart), id(bulk_ec_range), range, "${bulk_ec_entity}", id(accent), ${bulk_ec_low}, ${bulk_ec_high}, 0.6, ${bulk_ec_decimals});

sensor:
  - platform: homeassistant
    id: substrate_temp
    entity_id: ${substrate_temp_entity}
    on_value:
      - lambda: grow_dashboard::show_value(id(substrate_temp_value), id(substrate_temp_target), id(substrate_temp_status), x, ${substrate_temp_decimals}, ${substrate_temp_low}, ${substrate_temp_high});
  - platform: homeassistant
    id: vwc
    entity_id: ${vwc_entity}
    on_value:
      - lambda: grow_dashboard::show_value(id(vwc_value), id(vwc_target), id(vwc_status), x, ${vwc_decimals}, ${vwc_low}, ${vwc_high});
  - platform: homeassistant
    id: bulk_ec
    entity_id: ${bulk_ec_entity}
    on_value:
      - lambda: grow_dashboard::show_value(id(bulk_ec_value), id(bulk_ec_target), id(bulk_ec_status), x, ${bulk_ec_decimals}, ${bulk_ec_low}, ${bulk_ec_high});

lvgl:
  pages:
    - id: main_page
      bg_color: page_bg
      bg_opa: cover
      scrollable: false
      widgets:
        - !include parts/header.yaml
        - tileview:
            id: tiles
            x: 0
            y: 76
            width: 1280
            height: 644
            bg_opa: transp
            scrollbar_mode: "OFF"
            on_value:
              - script.execute: update_header
            tiles:
              - !include parts/climate-tile.yaml
              - !include parts/substrate-tile.yaml
