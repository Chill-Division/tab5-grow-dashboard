# Tab5 grow dashboard, zones layout: your device's YAML.
#
# Paste this into a new device in the ESPHome dashboard (or merge it into the Tab5's
# existing YAML), then point the zone lines at your Home Assistant sensors.
# Everything else comes from dashboard-zones.yaml in
# https://github.com/Chill-Division/tab5-grow-dashboard
substitutions:
  name: m5stack-tab5
  friendly_name: M5Stack Tab5
  room_name: Grow room

  # Release to use. Change it to update; the package and its C++ helpers both follow it.
  dashboard_ref: v0.2.0

  # Climate sensors in Home Assistant
  vpd_entity: sensor.room_vpd
  co2_entity: sensor.room_co2
  temp_entity: sensor.room_temperature
  humidity_entity: sensor.room_humidity

  # Each zone: its name, then VWC, bulk EC and temperature from probe 1 and probe 2
  zone1_name: Zone 1
  zone1_vwc_1: sensor.zone1_probe1_vwc
  zone1_vwc_2: sensor.zone1_probe2_vwc
  zone1_ec_1: sensor.zone1_probe1_bulk_ec
  zone1_ec_2: sensor.zone1_probe2_bulk_ec
  zone1_temp_1: sensor.zone1_probe1_temperature
  zone1_temp_2: sensor.zone1_probe2_temperature

  zone2_name: Zone 2
  zone2_vwc_1: sensor.zone2_probe1_vwc
  zone2_vwc_2: sensor.zone2_probe2_vwc
  zone2_ec_1: sensor.zone2_probe1_bulk_ec
  zone2_ec_2: sensor.zone2_probe2_bulk_ec
  zone2_temp_1: sensor.zone2_probe1_temperature
  zone2_temp_2: sensor.zone2_probe2_temperature

  zone3_name: Zone 3
  zone3_vwc_1: sensor.zone3_probe1_vwc
  zone3_vwc_2: sensor.zone3_probe2_vwc
  zone3_ec_1: sensor.zone3_probe1_bulk_ec
  zone3_ec_2: sensor.zone3_probe2_bulk_ec
  zone3_temp_1: sensor.zone3_probe1_temperature
  zone3_temp_2: sensor.zone3_probe2_temperature

  # Target ranges: the green band on each chart. Outside it the tile shows an amber
  # High/Low (for the zone tiles, judged on the average of the two probes). Units,
  # decimal places and the rest can be overridden the same way; see the substitutions
  # at the top of parts/base.yaml for the full list.
  vpd_low: "0.8"
  vpd_high: "1.2"
  co2_low: "800"
  co2_high: "1200"
  temp_low: "22"
  temp_high: "28"
  humidity_low: "55"
  humidity_high: "70"
  vwc_low: "40"
  vwc_high: "60"
  bulk_ec_low: "1.5"
  bulk_ec_high: "3.0"
  bulk_ec_unit: mS/cm

  # The screens swap every cycle_interval, once nobody has touched them for cycle_pause
  cycle_interval: 30s
  cycle_pause: 3min

  # Landscape. Use "270" if the picture is upside down for the way you've mounted it.
  rotation: "90"

packages:
  dashboard: github://Chill-Division/tab5-grow-dashboard/dashboard-zones.yaml@${dashboard_ref}

# Keep the wifi, api and ota blocks the ESPHome dashboard generated for your device.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
