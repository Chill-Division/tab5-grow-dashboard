# The substrate screen of dashboard-zones.yaml: one row per zone.
id: tile_substrate
row: 0
column: 1
dir: HOR
widgets:
  - !include
    file: zone-row.yaml
    vars:
      n: 1
      y: 4
      zone_name: ${zone1_name}
  - !include
    file: zone-row.yaml
    vars:
      n: 2
      y: 214
      zone_name: ${zone2_name}
  - !include
    file: zone-row.yaml
    vars:
      n: 3
      y: 424
      zone_name: ${zone3_name}
