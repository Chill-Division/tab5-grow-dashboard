# Tab5 grow dashboard: your device's YAML.
#
# Paste this into a new device in the ESPHome dashboard (or merge it into the Tab5's
# existing YAML), then point the *_entity lines at your Home Assistant sensors.
# Everything else comes from dashboard.yaml in
# https://github.com/Chill-Division/tab5-grow-dashboard
substitutions:
  name: m5stack-tab5
  friendly_name: M5Stack Tab5
  room_name: Grow room

  # Release to use. Change it to update; the package and its C++ helpers both follow it.
  dashboard_ref: v0.1.0

  # Your sensors in Home Assistant
  vpd_entity: sensor.room_vpd
  co2_entity: sensor.room_co2
  temp_entity: sensor.room_temperature
  humidity_entity: sensor.room_humidity
  substrate_temp_entity: sensor.substrate_temperature
  vwc_entity: sensor.substrate_vwc
  bulk_ec_entity: sensor.substrate_bulk_ec

  # Target ranges: the green band on each chart. Outside it the tile shows an amber
  # High/Low. Units, decimal places and the rest can be overridden the same way; see
  # the substitutions at the top of dashboard.yaml for the full list.
  vpd_low: "0.8"
  vpd_high: "1.2"
  co2_low: "800"
  co2_high: "1200"
  temp_low: "22"
  temp_high: "28"
  humidity_low: "55"
  humidity_high: "70"
  substrate_temp_low: "18"
  substrate_temp_high: "24"
  vwc_low: "40"
  vwc_high: "60"
  bulk_ec_low: "1.5"
  bulk_ec_high: "3.0"

  # The screens swap every cycle_interval, once nobody has touched them for cycle_pause
  cycle_interval: 30s
  cycle_pause: 3min

packages:
  dashboard: github://Chill-Division/tab5-grow-dashboard/dashboard.yaml@${dashboard_ref}

# Keep the wifi, api and ota blocks the ESPHome dashboard generated for your device.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
